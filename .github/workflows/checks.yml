# What a contributor would run before pushing, run for them.
#
# Nothing here touches NSW ePlanning, Overpass, SIX or Valhalla: they are free
# services this tool is a guest of, and a CI run is not a reason to spend their
# capacity. So the sheets themselves are not generated — what is checked is
# that the code compiles, the pages are all there, the scripts parse, and the
# image the server builds still builds.

name: checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the one before it: there is nothing to learn from
# finishing a run for a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, scripts and routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'        # what the runtime image ships
          cache: npm
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # tsc never looks at web/. Those files go to the browser as written, so
      # a syntax error there is otherwise found by whoever loads the page.
      - name: browser scripts parse
        run: |
          for f in web/*.js; do
            echo "  $f"
            node --check "$f"
          done

      # These run unattended on a host there is no shell access to, so a syntax
      # error surfaces as a deploy that quietly stopped happening.
      - name: deploy scripts parse
        run: |
          for f in deploy/*.sh; do
            echo "  $f"
            bash -n "$f"
          done

      # `bash -n` cannot see this, and it is worse than a syntax error because
      # it parses clean and then truncates the command at runtime: the shell
      # takes the rest of that physical line as comment and ends the command at
      # its unescaped newline. It happened in the deployer's own `docker run`.
      - name: no comment sits inside a line continuation
        run: |
          awk 'prev ~ /\\$/ && $0 ~ /^[[:space:]]*#/ {
                 printf "  %s:%d: comment inside a line continuation\n", FILENAME, NR
                 bad = 1
               }
               { prev = $0 }
               END { exit bad }' deploy/*.sh
          echo "  none"

      # And the command itself, run for real with docker stubbed out. What the
      # truncation cost was the operator code, the API key, both volumes and the
      # image name — and `docker rm -f` runs on the line above it, so the next
      # deploy would have taken the container away with nothing to put back.
      # Stated as the assertion it broke: both codes reach the container, and
      # the last argument is the image.
      - name: the deployer's docker run carries every secret and its image
        run: |
          block=$(sed -n '/^docker run -d --name site-analyst/,/^  site-analyst/p' \
                    deploy/update.sh | sed 's# >/dev/null##')
          { echo 'docker() { printf "%s\n" "$@"; }'; printf '%s\n' "$block"; } > /tmp/dr.sh
          argv=$(ACCESS_CODE=pub ADMIN_CODE=ops TFNSW_API_KEY=tf \
                 STRIPE_SECRET_KEY=sk STRIPE_PRICE_ID=price STRIPE_SITE_PRICE_ID=site \
                 STRIPE_WEBHOOK_SECRET=wh SMTP_HOST=mx SMTP_PASS=pw TURNSTILE_SECRET_KEY=ts \
                 NET=net OUT=/tmp/out bash /tmp/dr.sh)
          printf '%s\n' "$argv" | sed 's/^/    /'
          fail=0
          for want in ACCESS_CODE=pub ADMIN_CODE=ops STRIPE_SECRET_KEY=sk \
                      STRIPE_PRICE_ID=price STRIPE_SITE_PRICE_ID=site STRIPE_WEBHOOK_SECRET=wh \
                      SMTP_HOST=mx SMTP_PASS=pw TURNSTILE_SECRET_KEY=ts; do
            printf '%s\n' "$argv" | grep -qx -- "$want" || { echo "  missing $want"; fail=1; }
          done
          if [ "$(printf '%s\n' "$argv" | tail -1)" != "site-analyst" ]; then
            echo "  the last argument is not the image"; fail=1
          fi
          exit $fail

      # The status page tells a visitor to sign in with the operator code, and
      # used to link to a page that hides the code field from anyone who already
      # has a session — the precise person it was talking to. ?signin is what
      # makes that page ask again. Checked by grep because the behaviour needs a
      # browser, which this workflow deliberately does not install.
      - name: the status page's sign-in link can be acted on
        run: |
          grep -q 'href="/admin"' web/status.html
          grep -q "gate: 'admin'" web/admin.js
          echo "  the status page points at a gate that asks"

      # Two renders with different templates must not see each other's. This
      # was a module-level global, and its failure mode was not a crash but a
      # sheet in the wrong house style — the kind of bug that ships.
      - name: templates do not leak between concurrent renders
        run: npx tsx test/template-isolation.mts

      # The site sheet's tree canopies, kerbside bays and sight lines are pure
      # geometry on made-up ground, so they are checked here without a network.
      - name: canopies, kerbside bays and sight lines behave
        run: npx tsx test/site-features.mts

      # The storeys-from-the-DA fallback for footprints without a height is
      # record selection and point-in-polygon on made-up lots: no network.
      - name: the DA-storey height fallback picks the right applications
        run: npx tsx test/heights.mts

      # The planning yield is geometry and arithmetic on made-up lots: the
      # storeys a height holds, the ADG's separations stepping the envelope,
      # the podium, an L-shaped lot, the plates held to a depth or a tower
      # size, and the apartments and parking the floor area makes.
      - name: the yield study builds what the controls allow
        run: npx tsx test/yield.mts

      # Kerb lines on paper: a footpath's width out from the boundary on the
      # street's side, measured from a mapped footpath where there is one,
      # none along a lane or between two lots, a carriageway kept in a
      # narrow reserve, and a mapped kerb in place of the estimate beside it.
      - name: the kerb lines sit where a footpath would end
        run: npx tsx test/kerbs.mts

      # The Major Projects register is HTML, parsed: its listing cards, a
      # project page's details and point, and the council-area matching, on
      # trimmed copies of the markup. CI never calls the Planning Portal.
      - name: the Major Projects register's pages parse
        run: npx tsx test/major-projects.mts

      # Slide 12's Street View planner is geometry on made-up streets, lots and
      # footprints, with the metadata service and fetch stood in for: which
      # sides are frontages, which cameras stand in a shop or behind a
      # neighbour, and how the URLs are signed. CI never calls Google.
      - name: the Street View planner frames the frontages and nothing else
        run: npx tsx test/street-view.mts

      # Slide 13's wind roses are counted from hours: the sectors, the speed
      # classes and calms, the seasons, the prevailing runs and NASA POWER's
      # JSON, on made-up hours. CI never calls NASA.
      - name: the wind roses count the hours right
        run: npx tsx test/wind.mts

      # North-align turns the sheet so the site lies with its long side
      # horizontal, whatever its bearing or shape, on made-up lots.
      - name: north-align lays the site's long side horizontal
        run: npx tsx test/site-rotation.mts

      # Slide 15's heritage layers on made-up features: outlines clipped to the
      # strip, a permit over the lot told from one that grazes its kerb, AHIP
      # records merged by permit, the RNE's rejected places left out, and what
      # the slide says of a nomination and of the archive. CI never calls
      # Heritage NSW, DCCEEW or ePlanning.
      - name: the Country slide's permits, lists and landscape maps read right
        run: npx tsx test/country-heritage.mts

      # Free and subscription, through the server on a planted sheet: a free
      # account's PDF stamped and its CAD and data refused, the subscription's
      # clean whether given, held by code or paid for by a signed Stripe
      # webhook, and a forged webhook granting nothing. Nothing is drawn, and
      # nothing reaches Stripe or the public data services.
      - name: the free side is stamped and the subscription is not
        run: npx tsx test/plans.mts

      # The emailed links and what holds the account forms down, through the
      # server with Resend stood in for: a sign-up is no account until its
      # emailed link is pressed, a taken address is answered alike and its
      # owner emailed instead, a stranger's unverified sign-up is handed to
      # whoever proves the mailbox, a listed address gets the subscription only
      # once verified, one inbox gets at most three emails an hour, wrong
      # passwords from many addresses hold the account, and a forged
      # X-Forwarded-For starts no limit afresh. Nothing reaches Resend.
      - name: the emailed links verify, reset, and cannot be turned on strangers
        run: npx tsx test/auth-email.mts

      # The same links over SMTP, as through a Namecheap Private Email box,
      # with the mail server stood in for by a small one on the runner: the
      # login is the mailbox's, the mail comes from it and carries working
      # links, SMTP wins over a Resend key, and a refused login makes RESEND
      # say it could not send. Nothing reaches a real mail server.
      - name: the emailed links go out over SMTP
        run: npx tsx test/smtp-email.mts

      # The human check (Cloudflare Turnstile) and the honeypot, with
      # Cloudflare's siteverify stood in for: sign-up and the reset email need
      # a good token, a filled-in honeypot is answered alike with nothing sent,
      # sign-in meets the check after three wrong passwords at an account or
      # five from an address, and Cloudflare not answering refuses rather than
      # lets through. Nothing reaches Cloudflare.
      - name: the forms stand up to bots
        run: npx tsx test/bots.mts

      # The operator view's Stripe check, on made-up answers: it names the
      # account the key belongs to, and finds a price from the other mode, a
      # webhook missing an event, a portal never saved and a wrong secret.
      - name: the Stripe check finds what is set up wrong
        run: npx tsx test/billing-check.mts

      # The deployer's one job here is to leave a record even when it dies on
      # its first command — which is exactly what happened once, for six days,
      # unnoticed. Reproduce that: a repo whose origin cannot be reached, and a
      # status file that has to come out saying so.
      - name: deployer reports its own failure
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/state" "$tmp/repo"
          sed -e "s#^STATUS_DIR=/var/lib/site-analyst#STATUS_DIR=$tmp/state#" \
              -e "s#^cd /opt/site-analyst#cd $tmp/repo#" \
              deploy/update.sh > "$tmp/update.sh"
          git init -q "$tmp/repo"
          git -C "$tmp/repo" -c user.email=ci@example.com -c user.name=ci \
              commit -q --allow-empty -m init
          git -C "$tmp/repo" remote add origin https://invalid.invalid/nope.git
          bash "$tmp/update.sh" >/dev/null 2>&1 || true
          echo "  status: $(cat "$tmp/state/deploy.status" 2>/dev/null || echo '<nothing written>')"
          grep -q '^FAILED fetch' "$tmp/state/deploy.status"

      # One failed `docker run` must not be permanent. The pass after it finds
      # HEAD already at origin/main and, without this, reports "up-to-date" and
      # exits with nothing serving — turning a five-minute outage into an
      # indefinite one. Driven with docker and the app stubbed out, so it asks
      # nothing of any network and takes no time.
      - name: a missing container is a reason to deploy
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/state" "$tmp/bin"
          git init -q --bare "$tmp/origin.git"
          git init -q -b main "$tmp/repo"
          git -C "$tmp/repo" -c user.email=ci@example.com -c user.name=ci \
              commit -q --allow-empty -m init
          git -C "$tmp/repo" remote add origin "$tmp/origin.git"
          git -C "$tmp/repo" push -q origin main 2>/dev/null
          sha=$(git -C "$tmp/repo" rev-parse HEAD)
          printf 'ACCESS_CODE=shared\nADMIN_CODE=ops\nTFNSW_API_KEY=key\n' > "$tmp/env"

          # Stands in for the app: answers with the sha being deployed, and not
          # busy, so the health gate and the defer check both resolve at once.
          { echo '#!/usr/bin/env bash'
            echo "echo '{\"sha\":\"$sha\",\"busy\":false}'"; } > "$tmp/bin/curl"
          chmod +x "$tmp/bin/curl"

          # `docker inspect` is how the script asks whether anything is running;
          # $1 is "network" for the network check, so only a bare inspect answers.
          stub_docker() {
            { echo '#!/usr/bin/env bash'
              echo 'case "$1" in'
              echo "  inspect) $1 ;;"
              echo '  *) exit 0 ;;'
              echo 'esac'; } > "$tmp/bin/docker"
            chmod +x "$tmp/bin/docker"
          }

          sed -e "s#^STATUS_DIR=/var/lib/site-analyst#STATUS_DIR=$tmp/state#" \
              -e "s#^cd /opt/site-analyst#cd $tmp/repo#" \
              -e "s#\. /etc/site-analyst.env#. $tmp/env#" \
              deploy/update.sh > "$tmp/update.sh"

          run() {
            SITE_OUT="$tmp/out" PATH="$tmp/bin:$PATH" bash "$tmp/update.sh" \
              > "$tmp/log" 2>&1 || true
            cat "$tmp/state/deploy.status"
          }

          fail=0
          stub_docker 'exit 1'                 # nothing running
          got=$(run)
          echo "  container absent  -> $got"
          case "$got" in deployed*) ;; *) echo "  expected a deploy"; fail=1 ;; esac

          stub_docker 'echo true; exit 0'      # already running, repo unchanged
          got=$(run)
          echo "  container running -> $got"
          case "$got" in up-to-date*) ;; *) echo "  expected up-to-date"; fail=1 ;; esac

          exit $fail

      # A typecheck does not notice a page missing from web/, a route that
      # stopped matching, or an auth gate that moved. Boot the server and ask
      # it for every path that should be public — and for one that should not
      # exist, since unknown paths answering 401 instead of 404 is a bug this
      # repo has already had once.
      - name: routes answer
        run: |
          # Its output goes to a file, not to this step's stdout: a background
          # process holding that pipe open hangs anything reading it, long
          # after the checks themselves have finished.
          # Refuse to test against a process this step did not start. A
          # leftover server on this port has made a negative check here pass for
          # the wrong reason before, and a stale one carries spent rate-limit
          # budget, which reads as a broken gate.
          if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3123/api/version; then
            echo "something is already answering on 3123; refusing to test against it"
            exit 1
          fi
          ALLOW_NO_AUTH=1 PORT=3123 npx tsx src/server.ts > /tmp/routes-server.log 2>&1 &
          srv=$!
          # Best-effort reap. npx nests another node under itself, so this does
          # not always get the process holding the port — which is fine here,
          # since the runner is torn down with the job. The redirect above is
          # the part that matters; a stray child is untidy, a stray child on
          # this step's stdout is a hung job.
          trap 'pkill -P "$srv" 2>/dev/null; kill "$srv" 2>/dev/null; true' EXIT

          up=
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3123/api/version && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "server never answered; its log:"; sed 's/^/    /' /tmp/routes-server.log
            exit 1
          fi

          fail=0
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:3123$1")
            if [ "$got" = "$2" ]; then
              echo "  $1 -> $got"
            else
              echo "  $1 -> $got, expected $2"; fail=1
            fi
          }
          check /             200
          check /fuse         404   # the office door was removed
          check /about        200
          check /pricing      200
          check /terms        200
          check /pricing.js   200
          check /status       200
          check /style.css    200
          check /app.js       200
          check /status.js    200
          check /admin        200
          check /admin.js     200
          check /robots.txt   200
          check /sitemap.xml  200
          check /samples/og.jpg 200
          check /api/version  200
          check /nonsense     404

          # The deployer's account of itself has to reach /api/version: that is
          # the only window onto it from outside the host, and its absence is
          # what made a six-day outage invisible.
          if ! curl -s --max-time 10 http://127.0.0.1:3123/api/version | grep -q '"deploy"'; then
            echo "  /api/version carries no deploy field"; fail=1
          fi

          # og:url and og:image are absolute and filled in per request. The
          # placeholder reaching a browser means every shared link previews
          # against a URL that does not resolve.
          for path in / /about /pricing /terms; do
            if curl -s --max-time 10 "http://127.0.0.1:3123$path" | grep -q '%ORIGIN%'; then
              echo "  %ORIGIN% left unsubstituted in $path"; fail=1
            fi
          done

          # The card is a source file, not a page, and the samples route serves
          # images only. It should be reachable at neither.
          check /og-card.html          404
          check /samples/og-card.html  404

          # An unknown batch is not a server error.
          check /api/batches/00000000-0000-4000-8000-000000000000  404

          # Batch validation refuses before a single job is created, so none of
          # this asks anything of NSW ePlanning, Overpass, SIX or Valhalla —
          # which is the one thing this workflow must never do.
          batch() {
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -X POST -H 'Content-Type: application/json' -d "$2" \
              http://127.0.0.1:3123/api/batches)
            if [ "$got" = "$3" ]; then
              echo "  POST /api/batches ($1) -> $got"
            else
              echo "  POST /api/batches ($1) -> $got, expected $3"; fail=1
            fi
          }
          many=$(python3 -c "import json;print(json.dumps({'addresses':['%d Test Street, Sydney NSW 2000'%n for n in range(20)]}))")
          batch "no addresses"   '{"addresses":[]}'              400
          batch "not a list"     '{"addresses":"1 Test Street"}' 400
          batch "over the cap"   "$many"                         400
          batch "short entry"    '{"addresses":["abc"]}'         400

          # A session is a thirty-day HttpOnly cookie, so this is the only way
          # to put one down — and without it a browser holding the shared code
          # could not be handed the operator's for a month. It answers before
          # the auth wall on purpose: ending a session you hold is not a
          # privilege, and there is nothing there to refuse.
          hdrs=$(curl -s -D - -o /dev/null --max-time 10 -X POST \
                   http://127.0.0.1:3123/api/logout)
          code=$(printf '%s' "$hdrs" | sed -n '1s#.* \([0-9][0-9][0-9]\).*#\1#p')
          if [ "$code" = "200" ]; then
            echo "  POST /api/logout -> $code"
          else
            echo "  POST /api/logout -> $code, expected 200"; fail=1
          fi
          if printf '%s' "$hdrs" | grep -qi 'set-cookie: *sa_session=;.*Max-Age=0'; then
            echo "  POST /api/logout clears sa_session"
          else
            echo "  POST /api/logout did not clear sa_session:"
            printf '%s' "$hdrs" | grep -i set-cookie | sed 's/^/      /'; fail=1
          fi
          # Signing out must take a POST. A link a crawler or a prefetch can
          # follow would end sessions for people who never clicked anything.
          if curl -s -D - -o /dev/null --max-time 10 \
               http://127.0.0.1:3123/api/logout | grep -qi 'set-cookie'; then
            echo "  GET /api/logout sets a cookie; it must not"; fail=1
          else
            echo "  GET /api/logout sets no cookie"
          fi

          exit $fail

      # The two gates, driven with real codes. None of this reaches NSW
      # ePlanning, Overpass, SIX or Valhalla — it is /api/login, /api/me and
      # /api/status only — and it is the behaviour that has been subtly wrong
      # more than once: a code that granted more than it was issued for, and a
      # session that could be neither put down nor changed.
      - name: the two gates grant what they should
        run: |
          # Refuse to test against a process this step did not start. A
          # leftover server on this port has made a negative check here pass for
          # the wrong reason before, and a stale one carries spent rate-limit
          # budget, which reads as a broken gate.
          if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3124/api/version; then
            echo "something is already answering on 3124; refusing to test against it"
            exit 1
          fi
          ACCESS_CODE=shared-for-ci ADMIN_CODE=operator-for-ci PORT=3124 \
            npx tsx src/server.ts > /tmp/gates-server.log 2>&1 &
          srv=$!
          trap 'pkill -P "$srv" 2>/dev/null; kill "$srv" 2>/dev/null; true' EXIT

          up=
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3124/api/version && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "server never answered; its log:"; sed 's/^/    /' /tmp/gates-server.log
            exit 1
          fi

          B=http://127.0.0.1:3124
          jar=$(mktemp)
          fail=0

          # A login attempt, keeping whatever cookie comes back. The limiter
          # allows ten in fifteen minutes, so this stays well inside it.
          login() {
            label=$1; want=$2; body=$3
            got=$(curl -s -b "$jar" -c "$jar" -o /tmp/login.out -w '%{http_code}' \
                    --max-time 10 -X POST -H 'Content-Type: application/json' \
                    -d "$body" "$B/api/login")
            if [ "$got" = "$want" ]; then
              echo "  $label -> $got"
            else
              echo "  $label -> $got, expected $want"; sed 's/^/      /' /tmp/login.out; fail=1
            fi
          }
          # What the server says this session is, and what it can reach.
          holds() {
            label=$1; want=$2
            got=$(curl -s -b "$jar" --max-time 10 "$B/api/me")
            st=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' --max-time 10 "$B/api/status")
            if [ "$got|$st" = "$want" ]; then
              echo "  $label -> $got | /api/status $st"
            else
              echo "  $label -> $got|$st, expected $want"; fail=1
            fi
          }

          # No session is still an answer, not a refusal: the site is open,
          # and /api/me says which side of it this viewer is on (free).
          none='{"authed":false,"operator":false,"required":true,"plan":"free","grants":{"cleanPdf":false,"openData":false},"account":null,"billing":{"subscription":false,"site":false},"humanCheck":null}|403'
          # Both codes carry the subscription; neither is an account.
          tail='"plan":"subscription","grants":{"cleanPdf":true,"openData":true},"account":null,"billing":{"subscription":false,"site":false},"humanCheck":null}'
          user="{\"authed\":true,\"operator\":false,\"required\":true,$tail|403"
          oper="{\"authed\":true,\"operator\":true,\"required\":true,$tail|200"

          holds "no session"                            "$none"

          # Drawing is open: without any session, a job lookup answers about
          # the job (404 for one that does not exist), never 401.
          got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                  "$B/api/jobs/00000000-0000-4000-8000-000000000000")
          if [ "$got" = "404" ]; then
            echo "  anonymous job lookup -> $got (open, not a 401)"
          else
            echo "  anonymous job lookup -> $got, expected 404"; fail=1
          fi
          login "shared gate, wrong code"          401  '{"code":"nope"}'
          login "shared gate, shared code"         200  '{"code":"shared-for-ci"}'
          holds "holding the shared code"               "$user"

          # The point of a separate gate: the shared code does not open it, and
          # being turned away does not cost the session already held.
          login "operator gate, shared code"       403  '{"code":"shared-for-ci","gate":"admin"}'
          holds "still holding the shared code"         "$user"

          login "operator gate, operator code"     200  '{"code":"operator-for-ci","gate":"admin"}'
          holds "holding the operator code"             "$oper"

          # The one that would hurt most quietly: an operator mistyping the
          # shared code at their own gate must not be traded down to it.
          login "operator gate, shared code again" 403  '{"code":"shared-for-ci","gate":"admin"}'
          holds "operator session not traded down"      "$oper"

          curl -s -b "$jar" -c "$jar" -o /dev/null -X POST --max-time 10 "$B/api/logout"
          holds "after signing out"                     "$none"

          # The shared gate takes either code: the operator code grants a
          # superset, so an operator holds one session rather than two.
          login "shared gate, operator code"       200  '{"code":"operator-for-ci"}'
          holds "operator through the shared gate"      "$oper"

          rm -f "$jar"
          exit $fail

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What deploy/update.sh runs on the server every time main moves. A build
      # that fails there is not an outage — `docker rm -f` comes after it, so
      # the old container keeps serving — but the deploy stops happening, and
      # the only sign of it is /api/version reporting a sha that never changes.
      - name: build the image the deployer builds
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t site-analyst .
