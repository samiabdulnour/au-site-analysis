  <path class="draw thin" pathLength="1" d="M 378 216
    C 374 228 364 234 352 234"/>
  <path class="draw" pathLength="1" d="M 500 478 L 492 534 L 498 598"/>
  <path class="draw" pathLength="1" d="M 528 478 L 536 534 L 530 598"/>
  <path class="draw thin" pathLength="1" d="M 478 598 L 520 598 M 512 598 L 552 598"/>
