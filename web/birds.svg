<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img"
     aria-label="Line drawings of a heron, a flamingo, a kingfisher and a canary — the four drawing styles — sketching themselves.">
<!-- The welcome page's second animation: the four birds the drawing styles are
     named after, as single-weight line art in the accent magenta on the yellow
     panel, each stroke drawing itself on and fading to start again. A
     placeholder to be merged with the real illustrations when they arrive: the
     geometry is plain paths, so a better bird only replaces its `d`. -->
<style>
  path, .k { fill: none; stroke: #c238b6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: #c238b6; stroke: none; }
  .thin { stroke-width: 2.5; }
  /* pathLength=1 on every stroke, so one dash rule draws them all: on, hold,
     fade, again. The dots only fade in and out on the same clock. */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1;
          animation: draw 10s cubic-bezier(.4,0,.3,1) infinite; }
  .dot  { opacity: 0; animation: ink 10s linear infinite; }
  @keyframes draw {
    0%       { stroke-dashoffset: 1; opacity: 1; }
    38%      { stroke-dashoffset: 0; }
    86%      { stroke-dashoffset: 0; opacity: 1; }
    94%,100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @keyframes ink {
    0%, 30%  { opacity: 0; }
    40%      { opacity: 1; }
    86%      { opacity: 1; }
    94%,100% { opacity: 0; }
  }
  /* The birds take their turns: each group starts a beat after the last. */
  .b1 .draw, .b1 .dot { animation-delay: 0s; }
  .b2 .draw, .b2 .dot { animation-delay: .7s; }
  .b3 .draw, .b3 .dot { animation-delay: 1.4s; }
  .b4 .draw, .b4 .dot { animation-delay: 2.1s; }
  .deco .draw { animation-delay: 2.6s; }
  @media (prefers-reduced-motion: reduce) {
    .draw, .dot { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>

<!-- heron, standing left -->
<g class="b1">
  <path class="draw" pathLength="1" d="M 64 318 L 148 302
    C 162 296 174 300 178 312
    C 182 324 176 334 166 338
    C 150 346 146 362 154 380
    C 162 398 186 406 214 412
    C 252 420 280 446 288 486
    C 292 508 288 526 276 536
    C 248 558 204 552 184 522
    C 170 500 170 470 182 440"/>
  <path class="draw" pathLength="1" d="M 64 318 L 146 316"/>
  <path class="draw thin" pathLength="1" d="M 180 306 L 210 298"/>
  <path class="draw thin" pathLength="1" d="M 222 430 C 244 442 256 462 258 488"/>
  <path class="draw" pathLength="1" d="M 216 548 L 212 600"/>
  <path class="draw" pathLength="1" d="M 246 544 L 252 600"/>
  <path class="draw thin" pathLength="1" d="M 196 600 L 230 600 M 236 600 L 270 600"/>
  <circle class="dot" cx="160" cy="312" r="4.5"/>
</g>

<!-- flamingo, large in the centre -->
