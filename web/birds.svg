</g>

<!-- kingfisher, flying top right -->
<g class="b3">
  <path class="draw" pathLength="1" d="M 848 150 L 764 158"/>
  <path class="draw" pathLength="1" d="M 848 150 L 766 172"/>
  <path class="draw" pathLength="1" d="M 764 158
