<!-- a surveyor's registration marks, so the panel reads as a sheet -->
<g class="deco">
  <path class="draw thin" pathLength="1" d="M 70 70 H 102 M 86 54 V 86"/>
  <path class="draw thin" pathLength="1" d="M 798 586 H 830 M 814 570 V 602"/>
</g>
</svg>
