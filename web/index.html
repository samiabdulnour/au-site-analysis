<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Analyst</title>
<meta name="description" content="Generate NSW development-application site analysis drawings from a street address, using government open data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23111%27/%3E%3Crect x=%277%27 y=%277%27 width=%2718%27 height=%2718%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3Crect x=%2713%27 y=%2713%27 width=%276%27 height=%276%27 fill=%27%23e8402a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">

  <div class="top">
    <div class="name">SITE ANALYST</div>
    <div><a href="/about">how it works</a></div>
  </div>

  <!-- ---- access ------------------------------------------------------ -->
  <form id="login" hidden>
    <div class="sub">Enter your access code to generate drawings.</div>
    <div class="composer">
      <div class="entry">
        <input id="code" type="password" placeholder="Access code"
               autocomplete="current-password">
      </div>
      <button class="send" type="submit">Unlock</button>
    </div>
  </form>

  <!-- ---- the tool ---------------------------------------------------- -->
  <form id="f" hidden>
    <div class="sub">Search a NSW address to generate its site analysis.</div>
    <div class="composer">
      <div class="entry">
        <input id="address" type="text" placeholder="Search a NSW address…"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <ul id="suggest"></ul>
      </div>
      <button class="send" id="go" type="submit">Generate</button>
    </div>

    <div class="tools">
      <div class="group" id="sheetGroup"><span class="group-label">drawing</span>
        <span id="sheetOpts"></span></div>
      <div class="group" id="scaleRow"><span class="group-label">scale</span>
        <span id="scaleOpts"></span></div>
      <div class="group" id="northRow"><span class="group-label">north</span>
        <span id="northOpts"></span></div>
    </div>
  </form>

  <!-- ---- output ------------------------------------------------------ -->
  <div id="out" hidden>
    <div id="queue"></div>
    <div id="log"></div>
    <div id="links"></div>
    <div class="errline" id="error"></div>
  </div>

  <footer>
    Generated drafts, not a survey or a planning certificate.
    <a href="/about">What that means</a>.<br>
    © 2026 Sami Abdulnour. All rights reserved.
  </footer>

</div>

<div id="preview"><img alt=""><div class="cap"></div></div>

<script src="/app.js"></script>
</body>
</html>
